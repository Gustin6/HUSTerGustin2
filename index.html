<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薛定谔方程解析法 - 教学网站</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4A6FA5;
            --primary-light: #6B8CAE;
            --primary-dark: #3A5A8A;
            --secondary: #8FA8C8;
            --accent: #5B7A9E;
            --bg-light: #E8EEF4;
            --bg-medium: #D4DEE8;
            --bg-dark: #2C3E50;
            --text-primary: #2C3E50;
            --text-secondary: #5D6D7E;
            --text-muted: #8E99A4;
            --border-color: #CBD5DB;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #E8EEF4 0%, #D4DEE8 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            margin: -20px -20px 30px -20px;
            padding: 50px 20px;
            box-shadow: 0 4px 20px rgba(44, 62, 80, 0.15);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.92;
            font-weight: 400;
        }

        .nav-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .nav-row {
            display: flex;
            gap: 24px;
            justify-content: center;
            width: 100%;
        }

        .nav-card {
            background: white;
            border-radius: 16px;
            padding: 42px 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 18px rgba(44, 62, 80, 0.1);
            text-align: center;
            width: 260px;
            border: 1px solid var(--border-color);
        }

        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(74, 111, 165, 0.2);
            border-color: var(--primary-light);
        }

        .nav-card h3 {
            color: var(--text-primary);
            margin-bottom: 14px;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .nav-card p {
            color: var(--text-secondary);
            font-size: 0.98rem;
            line-height: 1.7;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.55);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(44, 62, 80, 0.2);
        }

        .modal-header {
            padding: 26px 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-header h2 {
            font-size: 1.55rem;
            font-weight: 600;
        }

        .close-btn {
            font-size: 1.8rem;
            cursor: pointer;
            opacity: 0.85;
            transition: opacity 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 30px;
        }

        .section {
            margin-bottom: 32px;
        }

        .section h4 {
            color: var(--primary);
            margin-bottom: 16px;
            font-size: 1.15rem;
            font-weight: 600;
            padding-left: 14px;
            border-left: 4px solid var(--primary);
        }

        .section p {
            color: var(--text-primary);
            line-height: 1.8;
            margin-bottom: 14px;
            font-size: 0.98rem;
        }

        .section ol, .section ul {
            margin-left: 24px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .section li {
            margin-bottom: 10px;
            line-height: 1.75;
            font-size: 0.96rem;
        }

        .equation-box {
            background: var(--bg-light);
            border-radius: 10px;
            padding: 22px;
            margin: 22px 0;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .equation-box h5 {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .concept-map {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 22px 0;
        }

        .concept-tag {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 0.86rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .concept-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 111, 165, 0.3);
        }

        .interactive-area {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin: 22px 0;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 10px rgba(44, 62, 80, 0.05);
        }

        .interactive-area h5 {
            color: var(--text-primary);
            margin-bottom: 18px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .slider-control {
            margin: 22px 0;
        }

        .slider-control label {
            display: block;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .slider-control input[type="range"] {
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: var(--bg-medium);
            outline: none;
        }

        .slider-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(74, 111, 165, 0.3);
        }

        .value-display {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 5px 14px;
            border-radius: 14px;
            margin-left: 10px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .canvas-container {
            width: 100%;
            min-height: 320px;
            background: white;
            border-radius: 10px;
            margin-top: 22px;
            position: relative;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .canvas-container canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .flow-chart {
            display: grid;
            gap: 16px;
            margin: 22px 0;
        }

        .flow-item {
            background: var(--bg-light);
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid var(--primary);
        }

        .flow-item h5 {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 600;
        }

        .flow-item p {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin-bottom: 8px;
        }

        .sub-flow {
            margin-left: 20px;
            margin-top: 16px;
            display: grid;
            gap: 12px;
        }

        .sub-flow .flow-item {
            border-left-color: var(--accent);
            padding: 16px;
        }

        .derivation-step {
            background: #F8FAFC;
            border-left: 4px solid var(--primary-light);
            padding: 18px;
            margin: 18px 0;
            border-radius: 0 8px 8px 0;
        }

        .derivation-step h5 {
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 0.98rem;
            font-weight: 600;
        }

        .highlight {
            background: linear-gradient(120deg, #FEF3C7 0%, #FDE68A 100%);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            color: #92400E;
        }

        .highlight-blue {
            background: linear-gradient(120deg, #DBEAFE 0%, #93C5FD 100%);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            color: #1E40AF;
        }

        .highlight-green {
            background: linear-gradient(120deg, #D1FAE5 0%, #6EE7B7 100%);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            color: #065F46;
        }

        .expand-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .expand-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(74, 111, 165, 0.3);
        }

        .expandable-content {
            display: none;
            background: white;
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .expandable-content.active {
            display: block;
        }

        .term-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(44, 62, 80, 0.25);
            z-index: 2000;
            max-width: 420px;
            width: 90%;
        }

        .term-modal.active {
            display: block;
        }

        .term-modal h3 {
            color: var(--primary);
            margin-bottom: 16px;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .term-modal p {
            color: var(--text-primary);
            line-height: 1.8;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .term-modal .close-term-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 22px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .term-modal .close-term-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(74, 111, 165, 0.3);
        }

        .energy-level-info {
            margin-top: 18px;
            padding: 18px;
            background: var(--bg-light);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .energy-level-info h6 {
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .energy-level-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .electron-cloud-container {
            width: 100%;
            height: 350px;
            background: #1E2D3D;
            border-radius: 12px;
            margin-top: 22px;
            position: relative;
            overflow: hidden;
            cursor: grab;
            border: 1px solid var(--border-color);
        }

        .electron-cloud-container:active {
            cursor: grabbing;
        }

        .electron-cloud-container canvas {
            width: 100%;
            height: 100%;
        }

        .cloud-controls {
            display: flex;
            gap: 14px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .cloud-controls button {
            background: var(--bg-light);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .cloud-controls button:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: white;
        }

        .cloud-controls button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quiz-question {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .quiz-question p {
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .quiz-question label {
            display: block;
            margin-bottom: 10px;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .quiz-question label:hover {
            background: var(--primary-light);
            color: white;
            border-color: var(--primary);
        }

        .quiz-question input[type="radio"] {
            margin-right: 10px;
        }

        #submit-quiz {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        #submit-quiz:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 15px rgba(74, 111, 165, 0.4);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.7rem;
            }

            header p {
                font-size: 0.95rem;
            }

            .modal-header h2 {
                font-size: 1.3rem;
            }

            .nav-row {
                flex-direction: column;
                align-items: center;
            }

            .nav-card {
                width: 100%;
                max-width: 280px;
            }

            .nav-row.top-row,
            .nav-row.bottom-row {
                width: 100%;
            }

            .modal-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>薛定谔方程解析法</h1>
            <p>探索量子力学的核心方程及其应用</p>
        </header>

        <div class="nav-grid">
            <div class="nav-row top-row">
                <div class="nav-card" onclick="openModal('history')">
                    <h3>历史背景</h3>
                    <p>了解薛定谔方程的发现历程和量子力学的发展</p>
                </div>
                <div class="nav-card" onclick="openModal('equation')">
                    <h3>方程构建</h3>
                    <p>深入理解薛定谔方程的数学形式和物理意义</p>
                </div>
                <div class="nav-card" onclick="openModal('simple')">
                    <h3>简单应用</h3>
                    <p>一维势阱、多维势阱的解析求解</p>
                </div>
            </div>
            <div class="nav-row bottom-row">
                <div class="nav-card" onclick="openModal('comprehensive')">
                    <h3>综合应用</h3>
                    <p>氢原子模型和量子化条件</p>
                </div>
                <div class="nav-card" onclick="openModal('modern')">
                    <h3>现代方法</h3>
                    <p>有限差分、有限元、PINN等数值方法</p>
                </div>
                <div class="nav-card" onclick="openModal('quiz')">
                    <h3>学习检测</h3>
                    <p>测试对薛定谔方程解析法的掌握程度</p>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">标题</h2>
                    <div class="close-btn" onclick="closeModal()">&times;</div>
                </div>
                <div class="modal-body" id="modal-body"></div>
            </div>
        </div>

        <div class="term-modal" id="term-modal">
            <h3 id="term-title">术语名称</h3>
            <div id="term-content"></div>
            <button class="close-term-btn" onclick="closeTermModal()">关闭</button>
        </div>
    </div>

    <script>
        const conceptTerms = {
            'planck': {
                title: '普朗克常数',
                content: `<p><strong>定义：</strong>普朗克常数\\( h \\)是量子力学中的基本常数，其值约为\\( 6.626 \\times 10^{-34} \\, \\text{J·s} \\)。</p>
                         <p><strong>来源：</strong>1900年，马克斯·普朗克在研究黑体辐射时提出能量量子化假说，引入了这一常数。他假设能量以离散的"量子"形式存在，\\( E = h\\nu \\)，其中\\( \\nu \\)是频率。</p>
                         <p><strong>意义：</strong>普朗克常数标志着经典物理学与量子物理学的分野，是量子力学的基石之一。约化普朗克常数\\( \\hbar = h/(2\\pi) \\)在量子力学中更为常用。</p>`
            },
            'debroglie': {
                title: '德布罗意波',
                content: `<p><strong>定义：</strong>德布罗意波，又称物质波，指所有微观粒子都具有波动性。</p>
                         <p><strong>来源：</strong>1924年，路易·德布罗意在其博士论文中提出物质波假说，认为任何运动的粒子都具有波动性，波长\\( \\lambda = h/p \\)，其中\\( p \\)是粒子动量。</p>
                         <p><strong>意义：</strong>这一假说揭示了微观粒子的波粒二象性，为薛定谔方程的建立奠定了基础，并被电子衍射实验所证实。</p>`
            },
            'uncertainty': {
                title: '海森堡不确定性原理',
                content: `<p><strong>定义：</strong>无法同时精确测量粒子的位置和动量，\\( \\Delta x \\cdot \\Delta p_x \\geq \\hbar/2 \\)。</p>
                         <p><strong>来源：</strong>1927年，维尔纳·海森堡提出这一原理，揭示了微观世界的基本限制。</p>
                         <p><strong>意义：</strong>不确定性原理是量子力学的核心原理之一，表明微观粒子的行为与经典粒子有本质区别。</p>`
            },
            'collapse': {
                title: '波函数坍缩',
                content: `<p><strong>定义：</strong>当对量子系统进行测量时，波函数会从叠加态瞬间"坍缩"到某一个本征态。</p>
                         <p><strong>来源：</strong>这是量子力学哥本哈根诠释的核心概念，由玻尔和海森堡等人提出。</p>
                         <p><strong>意义：</strong>波函数坍缩是量子测量的基本特征，体现了观察行为对量子系统的影响。</p>`
            }
        };

        function openTermModal(termId) {
            const term = conceptTerms[termId];
            document.getElementById('term-title').textContent = term.title;
            document.getElementById('term-content').innerHTML = term.content;
            document.getElementById('term-modal').classList.add('active');
            MathJax.typeset();
        }

        function closeTermModal() {
            document.getElementById('term-modal').classList.remove('active');
        }

        const modalData = {
            history: {
                title: '历史背景',
                content: `
                    <div class="section">
                        <h4>量子力学的诞生</h4>
                        <p>20世纪初，经典物理学在解释微观现象时遇到了根本性的困难：</p>
                        <ol>
                            <li><strong>黑体辐射问题</strong>：经典理论预言紫外灾难，普朗克于1900年提出能量量子化假说</li>
                            <li><strong>光电效应</strong>：爱因斯坦于1905年提出光子概念，解释了光的粒子性</li>
                            <li><strong>原子结构</strong>：卢瑟福的核式模型无法解释原子稳定性，玻尔于1913年提出量子化轨道理论</li>
                            <li><strong>物质波</strong>：德布罗意于1924年提出物质波假说，揭示微观粒子的波粒二象性</li>
                        </ol>
                    </div>
                    <div class="section">
                        <h4>薛定谔方程的提出</h4>
                        <p>1926年，埃尔温·薛定谔在德布罗意物质波假说的基础上，提出了描述量子系统状态随时间演化的偏微分方程。这一方程与海森堡的矩阵力学等价，共同构成量子力学的数学基础。</p>
                        <div class="equation-box">
                            <h5>薛定谔方程的发现历程</h5>
                            <p style="font-size: 0.9rem;">德布罗意关系 → 哈密顿-雅可比方程 → 薛定谔方程</p>
                        </div>
                    </div>
                    <div class="section">
                        <h4>波粒二象性与波函数诠释</h4>
                        <p>薛定谔方程描述了微观粒子的波动性，波函数\\( \\psi(\\mathbf{r},t) \\)包含了粒子的所有信息。玻恩的统计诠释指出，\\( |\\psi|^2 d\\mathbf{r} \\)表示在空间微元\\( d\\mathbf{r} \\)内找到粒子的概率。</p>
                    </div>
                    <div class="section">
                        <h4>核心概念</h4>
                        <p>点击以下概念标签查看详细解释：</p>
                        <div class="concept-map">

                                <p><strong>德布罗意假说</strong>：1924年德布罗意提出，任何微观粒子都具有波动性，波长\\( \\lambda = \\frac{h}{p} \\)。</p>

                        <div class="derivation-step">
                            <h5>步骤2：引入算符</h5>
                            <p><span class="highlight-blue">动量算符</span>：\\( \\hat{\\mathbf{p}} = -i\\hbar \\nabla \\)</p>
                            <p><span class="highlight-blue">能量算符</span>：\\( \\hat{E} = i\\hbar \\frac{\\partial}{\\partial t} \\)</p>
                            <button class="expand-btn" onclick="toggleExpand('expand-eq2')">查看详细推导</button>
                            <div class="expandable-content" id="expand-eq2">

                                <p>\\( \\hat{\\mathbf{p}} \\psi = -i\\hbar \\nabla e^{i(\\mathbf{k} \\cdot \\mathbf{r} - \\omega t)} = \\hbar \\mathbf{k} e^{i(\\mathbf{k} \\cdot \\mathbf{r} - \\omega t)} = \\mathbf{p} \\psi \\)</p>
                                <p><strong>能量算符验证</strong>：</p>
                                <p>\\( \\hat{E} \\psi = i\\hbar \\frac{\\partial}{\\partial t} e^{i(\\mathbf{k} \\cdot \\mathbf{r} - \\omega t)} = \\hbar \\omega e^{i(\\mathbf{k} \\cdot \\mathbf{r} - \\omega t)} = E \\psi \\)</p>

                        </div>

                            <h5>步骤3：建立波动方程</h5>

                        </div>
                        <p>其中\\( \\hat{H} = -\\frac{\\hbar^2}{2m} \\nabla^2 + V(\\mathbf{r},t) \\)称为<span class="highlight-green">哈密顿算符</span>。</p>

            const rotAxZ = { x: 0, y: 0, z: axisLen };

            const rotX_x = rotAxX.x * Math.cos(cloudRotation.y) - rotAxX.z * Math.sin(cloudRotation.y);
            const rotX_z = rotAxX.x * Math.sin(cloudRotation.y) + rotAxX.z * Math.cos(cloudRotation.y);
            const rotX_y = rotX_z * Math.cos(cloudRotation.x) - rotAxX.y * Math.sin(cloudRotation.x);

            const rotY_x = rotAxY.x * Math.cos(cloudRotation.y) - rotAxY.z * Math.sin(cloudRotation.y);
            const rotY_z = rotAxY.x * Math.sin(cloudRotation.y) + rotAxY.z * Math.cos(cloudRotation.y);
            const rotY_y = rotY_z * Math.cos(cloudRotation.x) - rotAxY.y * Math.sin(cloudRotation.x);

            const rotZ_x = rotAxZ.x * Math.cos(cloudRotation.y) - rotAxZ.z * Math.sin(cloudRotation.y);
            const rotZ_z = rotAxZ.x * Math.sin(cloudRotation.y) + rotAxZ.z * Math.cos(cloudRotation.y);
            const rotZ_y = rotZ_z * Math.cos(cloudRotation.x) - rotAxZ.y * Math.sin(cloudRotation.x);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(rotX_x, rotX_y);
            ctx.moveTo(0, 0);
            ctx.lineTo(rotY_x, rotY_y);
            ctx.moveTo(0, 0);
            ctx.lineTo(rotZ_x, rotZ_y);
            ctx.stroke();

            ctx.fillStyle = '#E74C3C';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('x', rotX_x + 5, rotX_y + 5);

            ctx.fillStyle = '#2ECC71';
            ctx.fillText('y', rotY_x + 5, rotY_y + 5);

            ctx.fillStyle = '#3498DB';
            ctx.fillText('z', rotZ_x + 5, rotZ_y + 5);

            ctx.fillStyle = '#A8B5C2';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            electronCloudDrawn = true;
        }

        function initElectronCloud() {
            const canvas = document.getElementById('cloud-canvas');
            if (!canvas) return;

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            drawElectronCloud();

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMousePos = { x: e.clientX, y: e.clientY };
            });

            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    cloudRotation.y += (e.clientX - lastMousePos.x) * 0.003;
                    cloudRotation.x += (e.clientY - lastMousePos.y) * 0.003;
                    lastMousePos = { x: e.clientX, y: e.clientY };
                    drawElectronCloud();
                }
            });

            canvas.addEventListener('mouseup', () => {
                isDragging = false;
            });

            canvas.addEventListener('mouseleave', () => {
                isDragging = false;
            });

            canvas.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    cloudScale = Math.max(0.5, Math.min(2, cloudScale * delta));
                    drawElectronCloud();
                }
            }, { passive: false });
        }

        function openModal(section) {
            const data = modalData[section];
            document.getElementById('modal-title').textContent = data.title;
            document.getElementById('modal-body').innerHTML = data.content;
            document.getElementById('modal').classList.add('active');

            MathJax.typeset();

            if (section === 'simple') {
                setTimeout(initWaveCanvas, 100);
            } else if (section === 'comprehensive') {
                cloudScale = 2;
                cloudRotation = { x: Math.PI / 6, y: Math.PI / 4 };
                setTimeout(initElectronCloud, 100);
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            electronCloudDrawn = false;
        }

        function initWaveCanvas() {
            const canvas = document.getElementById('wave-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const widthSlider = document.getElementById('width-slider');
            const widthDisplay = document.getElementById('well-width');

            canvas.width = 600;
            canvas.height = 320;

            const hbar = 1.0546e-34;
            const m = 9.1094e-31;
            const eV_conversion = 1.6022e-19;

            function calculateEnergy(n, L_nm) {
                const L = L_nm * 1e-9;
                return (n * n * Math.PI * Math.PI * hbar * hbar) / (2 * m * L * L * eV_conversion);
            }

            function draw() {
                const L = parseFloat(widthSlider.value);
                widthDisplay.textContent = L.toFixed(1);

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const x0 = 80;
                const x1 = canvas.width - 120;
                const y0 = canvas.height - 60;
                const y1 = 60;
                const wellWidth = x1 - x0;
                const wellHeight = y0 - y1;

                ctx.strokeStyle = '#4A6FA5';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x0, y1);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x1, y0);
                ctx.stroke();

                ctx.fillStyle = '#E8EEF4';
                ctx.globalAlpha = 0.6;
                ctx.fillRect(x0, y1, wellWidth, wellHeight);
                ctx.globalAlpha = 1;

                const scaleY = wellHeight / 3.8;
                const colors = ['#e74c3c', '#2ecc71', '#3498db'];

                const labelX = x1 + 15;

                for (let n = 1; n <= 3; n++) {
                    const baseY = y0 - (n - 1) * 50;

                    ctx.strokeStyle = '#E0E5EA';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(x0, baseY);
                    ctx.lineTo(x1, baseY);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.beginPath();
                    ctx.strokeStyle = colors[n-1];
                    ctx.lineWidth = 2.5;

                    for (let px = x0; px <= x1; px++) {
                        const xx = (px - x0) / wellWidth;
                        const k = n * Math.PI / L;
                        const wave = Math.sin(k * L * xx);
                        const canvasY = baseY - wave * scaleY / 2;

                        if (px === x0) {
                            ctx.moveTo(px, canvasY);
                        } else {
                            ctx.lineTo(px, canvasY);
                        }
                    }
                    ctx.stroke();

                    const E = calculateEnergy(n, L);

                    ctx.fillStyle = colors[n-1];
                    ctx.font = 'bold 11px Arial';
                    ctx.fillText(`n=${n}`, labelX, baseY - 8);
                    ctx.font = '10px Arial';
                    ctx.fillText(`E=${E.toFixed(3)} eV`, labelX, baseY + 6);

                    document.getElementById(`energy-n${n}`).textContent = E.toFixed(3);
                }

                ctx.strokeStyle = '#3A4A5A';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x0 - 5, y0);
                ctx.lineTo(x1 + 5, y0);
                ctx.moveTo(x0, y0 + 5);
                ctx.lineTo(x0, y1 - 5);
                ctx.stroke();

                ctx.fillStyle = '#3A4A5A';
                ctx.font = 'bold 11px Arial';
                ctx.fillText('x (位置)', x1 + 5, y0 + 18);
                ctx.save();
                ctx.translate(18, y0 - wellHeight / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.fillText('ψ(x) (波函数)', 0, 0);
                ctx.restore();

                ctx.fillStyle = '#6B7A8A';
                ctx.font = '10px Arial';
                ctx.fillText('0', x0 - 18, y0 + 4);
                ctx.fillText('势阱区域', x0 + 20, y0 + 15);
            }

            draw();
            widthSlider.addEventListener('input', draw);
        }

        function toggleExpand(contentId) {
            const content = document.getElementById(contentId);
            if (content) {
                content.classList.toggle('active');
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeTermModal();
            }
        });
    </script>
</body>
